
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gloria+Hallelujah&family=Shadows+Into+Light&display=swap" rel="stylesheet">
  <title>Rock Paper Scissors</title>

  <script src="script.js" defer></script>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
    }

    body {
      min-height: 100svh;
      background-color: #15141E;
      border: 3px solid whitesmoke;
      color: antiquewhite;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 0 16px 30px;
    }

    button {
      padding: 0;
      margin: 0;
      border: none;
      background: none;
      cursor: pointer;
    }

    #project {
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      color: antiquewhite;
      font-family: "Shadows Into Light", cursive;
      font-size: clamp(32px, 4vw, 52px);
      line-height: 1.15;
      margin: clamp(28px, 6vh, 55px) 0 clamp(30px, 7vh, 70px);
    }

    .chy {
      width: min(100%, 760px);
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: clamp(14px, 4vw, 42px);
      flex-wrap: wrap;
    }

    .move {
      width: clamp(105px, 18vw, 200px);
      height: clamp(105px, 18vw, 200px);
      display: block;
      object-fit: contain;
      background-color: transparent;
      border: clamp(3px, 0.35vw, 5px) antiquewhite solid;
      border-radius: 50%;
      padding: clamp(22px, 4vw, 45px);
      margin: 0;
    }

    .chy button:hover .move {
      transform: scale(1.03);
      transition: transform 0.15s ease;
    }

    .scoring {
      width: min(100%, 650px);
      margin: clamp(22px, 4vh, 35px) auto 0;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      color: antiquewhite;
      font-family: "Shadows Into Light", cursive;
      font-size: clamp(22px, 3vw, 32px);
      text-align: center;
    }

    .scoring p {
      margin: 0;
      flex: 1;
      white-space: nowrap;
    }

    .princess {
      display: flex;
      justify-content: center;
      align-items: center;
      margin: clamp(22px, 4vh, 38px) auto 0;
    }

    .reset {
      width: clamp(58px, 8vw, 100px);
      height: clamp(58px, 8vw, 100px);
      object-fit: contain;
      display: block;
    }

    .btn:hover .reset {
      transform: scale(1.05);
      transition: transform 0.15s ease;
    }

    #myModal {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: min(450px, calc(100vw - 32px));
      max-width: 450px;
      min-height: 260px;
      max-height: calc(100svh - 32px);
      margin: 0;
      border-radius: 20px;
      background-color: #15141E;
      color: white;
      border: 5px solid white;
      font-family: "Shadows Into Light", cursive;
      font-weight: 400;
      font-style: normal;
      text-align: center;
      padding: 30px 20px 24px;
      font-size: clamp(22px, 3vw, 28px);
      overflow: auto;
    }

    #statement {
      margin: 0 0 22px;
      line-height: 1.45;
    }

    dialog::backdrop {
      background-color: rgba(21, 20, 30, 0.6);
      backdrop-filter: blur(2px);
    }

    .close-btn {
      color: white;
      font-family: "Shadows Into Light", cursive;
      font-weight: 400;
      font-style: normal;
      text-align: center;
      font-size: clamp(21px, 3vw, 25px);
      border: 2px solid wheat;
      padding: 2px 10px;
      min-width: 78px;
      min-height: 42px;
    }

    @media (max-width: 600px) {
      body {
        padding: 0 10px 24px;
      }

      #project {
        margin-top: 26px;
        margin-bottom: 28px;
      }

      .chy {
        gap: 14px;
      }

      .move {
        width: min(28vw, 125px);
        height: min(28vw, 125px);
        padding: 24px;
      }

      .scoring {
        gap: 8px;
        margin-top: 22px;
        font-size: clamp(19px, 6vw, 25px);
      }

      .princess {
        margin-top: 24px;
      }

      #myModal {
        width: calc(100vw - 24px);
        min-height: 220px;
        padding: 25px 14px 20px;
        border-width: 4px;
      }
    }

    @media (max-width: 380px) {
      #project {
        font-size: 30px;
        margin-bottom: 24px;
      }

      .chy {
        gap: 9px;
      }

      .move {
        width: 29vw;
        height: 29vw;
        padding: 18px;
        border-width: 3px;
      }

      .scoring {
        font-size: 18px;
      }

      .scoring p {
        white-space: normal;
      }
    }

    @media (max-height: 600px) and (min-width: 601px) {
      #project {
        margin-top: 18px;
        margin-bottom: 24px;
      }

      .move {
        width: 145px;
        height: 145px;
        padding: 30px;
      }

      .scoring {
        margin-top: 16px;
      }

      .princess {
        margin-top: 15px;
      }
    }
  </style>

</head>

<body>

<p id="project">Rock Paper Scissors</p>

<div class="chy">

<button onclick="playGame('Rock')"><img src="rock1.png" class="move"></button>
<button onclick="playGame('Paper')"><img src="paper1.png" class="move"></button>
<button onclick="playGame('Scissors')"><img src="scissors1.png" class="move"></button>

</div>





<div class="scoring">

<p>Win: <span id="winList">0</span></p>
<p>Loss: <span id="lossList">0</span></p>
<p>Tie: <span id="tieList">0</span></p>


</div>


<div class="princess">

<button onclick="

score.wins= 0;
score.losses= 0;
score.ties= 0;

localStorage.removeItem('score');
updateScore();
rotate();


" class="btn"><img src="r1.png" class="reset" ></button>

</div>

  <button onclick="myModal.showModal()"></button>
  
  <dialog id="myModal">
  <p id="statement"></p>
  <button class="close-btn" onclick="myModal.close()">Close</button>
  </dialog>
  

  



</body>
</html>
